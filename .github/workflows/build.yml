name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore debug keystore
        id: ks
        uses: actions/cache@v4
        with:
          path: app/debug.keystore
          key: debug-keystore-v1
      - name: Create debug keystore if missing
        if: steps.ks.outputs.cache-hit != 'true'
        run: keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        run: gradle assembleRelease --stacktrace -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: siphon-debug-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk siphon-${{ github.run_number }}.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest siphon-${{ github.run_number }}.apk --title "SIPHON build ${{ github.run_number }}" --notes "Automated build ${{ github.run_number }}" --target ${{ github.sha }}